version: '3'

services:
  frontend:
    build:
      context: ./frontend
    container_name: frontend_service
    ports:
      - "5000:80"  # Optional for dev access


  backend:
    build:
      context: ./backend/zoomi
    container_name: backend_service
    expose:
      - "8000:8000"  # Change to match your backend port

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
