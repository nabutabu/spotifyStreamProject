services:
  backend:
    build:
      context: ./backend/zoomi
    container_name: backend_service
    ports:
    - "8000:8000"

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    container_name: nginx_service
    ports:
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend